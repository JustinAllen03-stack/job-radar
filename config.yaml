# Optional catch-all over many job sites (slower: hours, not minutes). Needs ADZUNA_APP_ID / ADZUNA_APP_KEY secrets.
adzuna:
  enabled: true
  where: Toronto
  distance_km: 80
  queries: ["biomedical engineer", "medical device engineer", "PCB designer", "PCB design engineer",
            "hardware engineer", "electrical engineer junior", "electronics engineer", "embedded hardware engineer"]
